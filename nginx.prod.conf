events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Access log without secrets: the parent pages (/rodzic, /rodzic/zgoda)
    # and the password-reset page are opened from e-mail links that carry a
    # token in ?t=. Log those paths without their query string, and never log
    # the Referer (it can repeat such a URL). The API itself receives tokens
    # only in POST bodies.
    map $uri $log_request_uri {
        ~^/(rodzic|reset-hasla)  $uri;
        default                  $request_uri;
    }
    log_format no_tokens '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $log_request_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log no_tokens;

    # Content-Security-Policy for every page and API response. Needs, besides
    # our own origin: inline scripts/styles (Next.js bootstrap, MUI/emotion,
    # KaTeX, MathLive), data:/blob: images and workers (Excalidraw, MathLive),
    # Google profile photos, Cloudflare Turnstile (script + iframe on
    # /rejestracja). Not sent with the task PDFs: browsers' built-in PDF
    # viewers do not all cope with a policy on the document itself (an empty
    # value makes add_header skip the header).
    map $uri $content_security_policy {
        ~^/pdf/  "";
        default  "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' wss://$host; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }

    server {
        listen 3100;

        client_max_body_size 50m;

        # Security headers for everything this server answers (pages, API,
        # uploads, websocket handshakes). "always": also on 4xx/5xx. No
        # location below may use add_header - that would drop these there.
        # Referrer-Policy is left to Next.js (no-referrer on the token pages;
        # a second value here would override it).
        add_header Content-Security-Policy $content_security_policy always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=()" always;
        # Upstream must not set these too (one value each)
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Powered-By;

        # WebSocket - proxy to API backend
        location /ws/ {
            proxy_pass http://api:8100;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Pages opened from e-mail links: ?t= carries a token until the page
        # hides it. The access log already drops their query string (above);
        # upstream errors would put the full request line into the error log
        # at level "error", so here it only records "crit" and worse.
        location ~ ^/(rodzic|reset-hasla)(/|$) {
            error_log /dev/stderr crit;
            proxy_pass http://frontend:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        # Everything else - proxy to Next.js frontend
        location / {
            proxy_pass http://frontend:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }
    }
}
