# Production Docker Compose
# Nginx routes traffic: WebSocket → API, everything else → frontend

# Log rotation. Docker's json-file driver has NO size cap by default, so
# container logs grow until the disk fills, and data in them outlives the
# retention policy applied to the database (RODO art. 5(1)(e)).
# 50m x 5 = 250 MB per service - months of history at current traffic.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: omj-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-omj}
    volumes:
      # Bind mount for direct access on VM
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omj} -d ${POSTGRES_DB:-omj}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible within Docker network
    networks:
      - omj-network

  api:
    image: ghcr.io/rsokolowski/omj-validator-api:latest
    container_name: omj-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-omj}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omj}

      # Public URL for OAuth callbacks (required for Docker deployment)
      FRONTEND_URL: ${FRONTEND_URL:-https://omj-validator.pl}

      # Authentication
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY is required}

      # Access control
      PUBLIC_ACCESS: ${PUBLIC_ACCESS:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_GROUP_EMAIL: ${GOOGLE_GROUP_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}

      # AI Provider
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-90}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_MEDIA_RESOLUTION: ${GEMINI_MEDIA_RESOLUTION:-high}
      GEMINI_MEDIA_RESOLUTION_IMAGES: ${GEMINI_MEDIA_RESOLUTION_IMAGES:-high}
      GEMINI_DEBUG_LOGS: ${GEMINI_DEBUG_LOGS:-false}
      GEMINI_DISABLE_FILE_CACHE: ${GEMINI_DISABLE_FILE_CACHE:-false}

      # Translation (EN->PL for status messages)
      TRANSLATE_ENABLED: ${TRANSLATE_ENABLED:-false}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_TIMEOUT: ${TRANSLATE_TIMEOUT:-2.0}

      # Telegram notifications (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PSEUDONYM_SALT: ${TELEGRAM_PSEUDONYM_SALT:-}

      # Data retention (RODO art. 5(1)(e)) - 0 disables a pass, do not do that here
      RETENTION_SUBMISSION_MONTHS: ${RETENTION_SUBMISSION_MONTHS:-24}
      RETENTION_SCORING_THINKING_DAYS: ${RETENTION_SCORING_THINKING_DAYS:-90}
      RETENTION_INACTIVE_ACCOUNT_MONTHS: ${RETENTION_INACTIVE_ACCOUNT_MONTHS:-36}
      RETENTION_ADMIN_AUDIT_MONTHS: ${RETENTION_ADMIN_AUDIT_MONTHS:-12}
      RETENTION_AUTO_PURGE: ${RETENTION_AUTO_PURGE:-true}

      # Rate Limiting (rolling 24h windows)
      RATE_LIMIT_NEW_USERS_PER_DAY: ${RATE_LIMIT_NEW_USERS_PER_DAY:-50}
      RATE_LIMIT_SUBMISSIONS_PER_USER_PER_DAY: ${RATE_LIMIT_SUBMISSIONS_PER_USER_PER_DAY:-30}
      RATE_LIMIT_SUBMISSIONS_GLOBAL_PER_DAY: ${RATE_LIMIT_SUBMISSIONS_GLOBAL_PER_DAY:-500}
    volumes:
      # Persist uploads - bind mount for direct access on VM
      - ./data/uploads:/app/data/uploads
    ports:
      # Non-standard port for Nginx proxy
      - "127.0.0.1:8100:8100"
    networks:
      - omj-network

  frontend:
    image: ghcr.io/rsokolowski/omj-validator-frontend:latest
    container_name: omj-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Runtime backend URL (must match build-time for rewrites)
      FASTAPI_URL: http://api:8100
    # No host port - accessed via nginx only
    networks:
      - omj-network

  nginx:
    image: nginx:alpine
    container_name: omj-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - frontend
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - omj-network

networks:
  omj-network:
    driver: bridge
