# Development Docker Compose - starts full stack locally
# Usage: ./start.sh or docker compose up

services:
  db:
    image: postgres:16-alpine
    container_name: omj-postgres
    environment:
      POSTGRES_USER: omj
      POSTGRES_PASSWORD: omj
      POSTGRES_DB: omj
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omj -d omj"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omj-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: omj-api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      # Database (use internal Docker network)
      DATABASE_URL: postgresql://omj:omj@db:5432/omj

      # Authentication disabled for local dev (no external OAuth URL)
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-dev-secret-key-change-in-production}

      # Google OAuth (optional for local dev)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Access control
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_GROUP_EMAIL: ${GOOGLE_GROUP_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}

      # AI Provider (AI_PROVIDER only accepts gemini; the active model is chosen in /admin/settings)
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-90}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_MEDIA_RESOLUTION: ${GEMINI_MEDIA_RESOLUTION:-high}
      GEMINI_MEDIA_RESOLUTION_IMAGES: ${GEMINI_MEDIA_RESOLUTION_IMAGES:-high}
      GEMINI_DEBUG_LOGS: ${GEMINI_DEBUG_LOGS:-false}
      GEMINI_DISABLE_FILE_CACHE: ${GEMINI_DISABLE_FILE_CACHE:-false}
      # Anthropic (Claude) - selectable in /admin/settings once approved.
      # PROCESSOR_APPROVED stays false here; set it in .env after the GDPR sign-off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-high}
      ANTHROPIC_EFFORT_AUX: ${ANTHROPIC_EFFORT_AUX:-medium}
      ANTHROPIC_TIMEOUT: ${ANTHROPIC_TIMEOUT:-180}
      ANTHROPIC_PROCESSOR_APPROVED: ${ANTHROPIC_PROCESSOR_APPROVED:-false}

      # Translation (EN->PL for status messages)
      TRANSLATE_ENABLED: ${TRANSLATE_ENABLED:-false}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_TIMEOUT: ${TRANSLATE_TIMEOUT:-2.0}

      # Telegram notifications - off locally. Deliberately NOT the TELEGRAM_*
      # names: .env usually holds the production bot, and dev test submissions
      # would land in the production chat. Set DEV_TELEGRAM_* to opt in.
      # Never carry a user's name or e-mail - see app/notifications.py
      TELEGRAM_BOT_TOKEN: ${DEV_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${DEV_TELEGRAM_CHAT_ID:-}
      TELEGRAM_PSEUDONYM_SALT: ${DEV_TELEGRAM_PSEUDONYM_SALT:-}

      # E-mail: console by default - messages and their links go to the API log
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}

      # Data retention - disabled locally so dev data is never silently deleted
      RETENTION_SUBMISSION_MONTHS: ${RETENTION_SUBMISSION_MONTHS:-0}
      RETENTION_SCORING_THINKING_DAYS: ${RETENTION_SCORING_THINKING_DAYS:-0}
      RETENTION_INACTIVE_ACCOUNT_MONTHS: ${RETENTION_INACTIVE_ACCOUNT_MONTHS:-0}
      RETENTION_ADMIN_AUDIT_MONTHS: ${RETENTION_ADMIN_AUDIT_MONTHS:-0}
      RETENTION_PRIVATE_TASK_MONTHS: ${RETENTION_PRIVATE_TASK_MONTHS:-0}
      RETENTION_PATTERN_MONTHS: ${RETENTION_PATTERN_MONTHS:-0}
      RETENTION_AI_USAGE_DAYS: ${RETENTION_AI_USAGE_DAYS:-0}
      RETENTION_AUTO_PURGE: ${RETENTION_AUTO_PURGE:-false}

      # App Configuration
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-10}
    volumes:
      # Mount code for hot-reload
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./prompts:/app/prompts
      - ./tasks:/app/tasks
      - ./data/tasks:/app/data/tasks
      # Generated locally, not in the repository (see NOTICE). Missing content
      # is handled gracefully - the app then links to the task PDF.
      - ./data/task_content:/app/data/task_content
      - ./data/skills.json:/app/data/skills.json
      - ./static:/app/static
      - ./templates:/app/templates
      # Persist uploads
      - ./data/uploads:/app/data/uploads
    ports:
      - "8000:8000"
    networks:
      - omj-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: omj-frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Backend URL for Next.js server-side requests
      FASTAPI_URL: http://api:8000
    volumes:
      # Mount code for hot-reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Don't mount node_modules (use container's)
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - omj-network

networks:
  omj-network:
    driver: bridge

volumes:
  postgres_data:
